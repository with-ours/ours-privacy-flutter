name: ours_privacy
description: >-
  Official Ours Privacy analytics SDK for Flutter apps on iOS and Android:
  events, identity, consent, sessions, screens, and deep-link attribution.
version: 1.0.1
homepage: https://oursprivacy.com
repository: https://github.com/with-ours/ours-privacy-flutter
issue_tracker: https://github.com/with-ours/ours-privacy-flutter/issues
documentation: https://docs.oursprivacy.com/docs/flutter-sdk
topics:
  - analytics
  - privacy
  - tracking
  - attribution

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

platforms:
  android:
  ios:

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
