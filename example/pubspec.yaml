name: ours_privacy_example
description: >-
  Demo app for the Ours Privacy Flutter SDK: tracking, identity, consent,
  screens, sessions, and deep-link attribution on iOS and Android.
publish_to: 'none'
version: 1.0.0+1

# The SDK supports Flutter 3.13 and later. This demo app targets current
# Flutter: its iOS shell uses the UIScene lifecycle, which needs app_links 7,
# and it uses package:material_ui, which replaced package:flutter/material.dart
# in Flutter 3.47.
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  app_links: ^7.2.2
  flutter:
    sdk: flutter
  http: ^1.1.0
  material_ui: ^1.4.0
  ours_privacy:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
